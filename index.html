<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEF1F6">
<title>Standup — inglés para trabajo remoto</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --paper:#EEF1F6;
  --surface:#FFFFFF;
  --ink:#0F1620;
  --muted:#5C6A7C;
  --line:#DCE2EB;
  --violet:#4B2FD6;
  --violet-soft:#EDE9FE;
  --green:#0B6E4F;
  --green-soft:#E3F2EC;
  --amber:#E8A317;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Roboto Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.55;
  padding-bottom:env(safe-area-inset-bottom);
}
.wrap{max-width:600px;margin:0 auto;padding:0 18px 64px}

/* ---------- barra superior ---------- */
.top{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 0 14px;position:sticky;top:0;background:var(--paper);z-index:5;
}
.brand{font-family:var(--mono);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.brand b{color:var(--ink);font-weight:600}
.streak{
  display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:13px;
  background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 11px;
}
.streak span{color:var(--amber);font-size:14px}

/* ---------- progreso ---------- */
.bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:26px}
.bar i{display:block;height:100%;background:var(--violet);width:0;transition:width .45s cubic-bezier(.4,0,.2,1)}

/* ---------- tarjeta ---------- */
.card{animation:rise .35s cubic-bezier(.2,.7,.3,1)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.eyebrow{
  font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);margin-bottom:10px;display:flex;gap:10px;align-items:center;
}
.eyebrow em{font-style:normal;color:var(--violet);font-weight:600}
.scene{font-size:17px;line-height:1.5;margin:0 0 16px}

/* mensaje entrante: el mundo del usuario es Slack */
.msg{
  background:var(--surface);border:1px solid var(--line);border-radius:4px 14px 14px 14px;
  padding:14px 16px;margin-bottom:20px;
}
.msg .who{font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:6px;letter-spacing:.08em}
.msg p{margin:0;font-family:var(--mono);font-size:15px;line-height:1.5}

.task{font-size:15px;color:var(--muted);margin:0 0 10px}

textarea{
  width:100%;min-height:104px;resize:vertical;
  font-family:var(--mono);font-size:15px;line-height:1.5;color:var(--ink);
  background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:13px 14px;
}
textarea:focus{outline:2px solid var(--violet);outline-offset:1px;border-color:transparent}
textarea::placeholder{color:#A9B3C0}

/* ---------- el diff: elemento firma ---------- */
.diff{margin-top:22px;animation:rise .3s cubic-bezier(.2,.7,.3,1)}
.side{border-left:3px solid var(--line);padding:2px 0 2px 14px;margin-bottom:18px}
.side .tag{
  font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);margin-bottom:5px;
}
.side .body{font-family:var(--mono);font-size:15px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.side.mine{border-left-color:var(--violet)}
.side.mine .tag{color:var(--violet)}
.side.mine .body{color:var(--muted)}
.side.native{border-left-color:var(--green);background:var(--green-soft);border-radius:0 8px 8px 0;padding:12px 14px}
.side.native .tag{color:var(--green)}

.why{margin:0 0 18px}
.why h4{
  font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);margin:0 0 6px;font-weight:500;
}
.why p{margin:0;font-size:15.5px;line-height:1.55}
.why code{font-family:var(--mono);font-size:14px;background:var(--violet-soft);padding:1px 5px;border-radius:4px}

.chunk{
  display:flex;align-items:center;gap:12px;
  background:var(--ink);color:#fff;border-radius:12px;padding:13px 15px;margin-bottom:22px;
}
.chunk .t{flex:1;font-family:var(--mono);font-size:14.5px;line-height:1.45}
.chunk button{
  flex:none;width:38px;height:38px;border-radius:50%;border:0;cursor:pointer;
  background:rgba(255,255,255,.14);color:#fff;font-size:16px;display:grid;place-items:center;
}
.chunk button:active{background:rgba(255,255,255,.3)}

/* ---------- botones ---------- */
.btn{
  width:100%;border:0;cursor:pointer;border-radius:11px;padding:15px;
  font-family:var(--sans);font-size:16px;font-weight:600;
  background:var(--violet);color:#fff;
}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--muted);font-weight:500;font-size:14px;padding:12px}

.rate{margin-top:4px}
.rate p{
  font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);margin:0 0 10px;text-align:center;
}
.rate .row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.rate button{
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:10px;padding:13px 6px;font-size:14px;font-family:var(--sans);cursor:pointer;
}
.rate button:active{background:var(--violet-soft);border-color:var(--violet)}

/* ---------- fin / vacío ---------- */
.done{text-align:center;padding:40px 0;animation:rise .4s ease}
.done .big{font-family:var(--mono);font-size:46px;color:var(--amber);line-height:1}
.done h2{font-size:22px;margin:16px 0 6px}
.done p{color:var(--muted);margin:0 0 26px}
.stat{display:flex;justify-content:center;gap:28px;margin-bottom:28px}
.stat div{text-align:center}
.stat b{display:block;font-family:var(--mono);font-size:22px}
.stat span{font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}

/* ---------- cuaderno ---------- */
.book{margin-top:34px;border-top:1px solid var(--line);padding-top:22px}
.book h3{
  font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);font-weight:500;margin:0 0 14px;
}
.book ul{list-style:none;margin:0;padding:0}
.book li{
  font-family:var(--mono);font-size:14px;padding:11px 0;border-bottom:1px solid var(--line);
  display:flex;gap:10px;align-items:flex-start;
}
.book li:last-child{border-bottom:0}
.book li b{color:var(--violet);font-weight:400;flex:none}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="brand"><b>Standup</b> · inglés de trabajo</div>
    <div class="streak"><span>▲</span><i id="streakN" style="font-style:normal">0</i></div>
  </div>

  <div class="bar"><i id="bar"></i></div>

  <div id="app"></div>

  <div class="book" id="book" hidden>
    <h3>Tu cuaderno</h3>
    <ul id="bookList"></ul>
  </div>

</div>

<script>
/* =========================================================
   1. ALMACENAMIENTO
   Intenta localStorage; si el entorno lo bloquea, usa memoria.
   ========================================================= */
const Store = (()=>{
  let mem = {};
  let ok = false;
  try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); ok = true; }catch(e){ ok = false; }
  return {
    get(k, def){
      try{ const v = ok ? localStorage.getItem(k) : mem[k];
           return v == null ? def : JSON.parse(v); }catch(e){ return def; }
    },
    set(k, v){
      const s = JSON.stringify(v);
      try{ ok ? localStorage.setItem(k, s) : (mem[k] = s); }catch(e){ mem[k] = s; }
    }
  };
})();

   2. CONTENIDO
   Esto es lo único que define la app. Aquí van las 60.

/* =========================================================
   3. REPETICIÓN ESPACIADA
   Intervalos en días según cómo te fue.
   ========================================================= */
const HOY = () => Math.floor(Date.now()/86400000);
const SALTO = { 1:0, 2:2, 3:4 };   // ni idea / más o menos / lo tenía

function progreso(){ return Store.get('prog', {}); }
function guardarProgreso(p){ Store.set('prog', p); }

function calificar(id, nota){
  const p = progreso();
  const prev = p[id] || {n:0, intervalo:0};
  let intervalo;
  if(nota === 1) intervalo = 0;
  else if(nota === 2) intervalo = Math.max(2, Math.round(prev.intervalo * 1.5));
  else intervalo = Math.max(4, Math.round((prev.intervalo || 2) * 2.5));
  p[id] = { n: prev.n + 1, intervalo, vence: HOY() + intervalo };
  guardarProgreso(p);
}

function sesionDeHoy(){
  const p = progreso();
  const hoy = HOY();
  const repasos = LECCIONES.filter(l => p[l.id] && p[l.id].vence <= hoy);
  const nuevas  = LECCIONES.filter(l => !p[l.id]);
  return [...repasos, ...nuevas].slice(0, 5);
}

/* ---------- racha ---------- */
function tocarRacha(){
  const r = Store.get('racha', {dias:0, ultimo:-1});
  const hoy = HOY();
  if(r.ultimo === hoy) return r.dias;
  r.dias = (r.ultimo === hoy - 1) ? r.dias + 1 : 1;
  r.ultimo = hoy;
  Store.set('racha', r);
  return r.dias;
}
function racha(){ return Store.get('racha', {dias:0}).dias; }

/* =========================================================
   4. INTERFAZ
   ========================================================= */
const app  = document.getElementById('app');
const bar  = document.getElementById('bar');
let cola = [], i = 0, respuesta = '';

function esc(s){ return (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function hablar(t){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t);
  u.lang = 'en-US'; u.rate = .88;
  speechSynthesis.speak(u);
}

function pintarRacha(){ document.getElementById('streakN').textContent = racha(); }
function pintarBarra(){ bar.style.width = cola.length ? (i / cola.length * 100) + '%' : '0%'; }

function iniciar(){
  cola = sesionDeHoy(); i = 0;
  pintarRacha();
  cola.length ? pregunta() : fin(true);
}

/* ---------- pantalla de pregunta ---------- */
function pregunta(){
  const l = cola[i];
  pintarBarra();
  app.innerHTML = `
    <div class="card">
      <div class="eyebrow">
        <em>${l.tipo === 'producir' ? 'Escribe tu versión' : 'Descifra'}</em>
        <span>${i+1} / ${cola.length}</span>
      </div>
      <p class="scene">${l.escena}</p>
      ${l.mensaje ? `<div class="msg">
          <div class="who">${esc(l.quien || '')}</div>
          <p>${esc(l.mensaje)}</p>
        </div>` : ''}
      <p class="task">${l.tarea}</p>
      <textarea id="ta" placeholder="${l.tipo === 'producir' ? 'Escribe en inglés. Aunque no estés seguro.' : 'Escribe en español lo que entendiste.'}"></textarea>
      <div style="height:14px"></div>
      <button class="btn" id="ver">Ver cómo suena natural</button>
      <button class="btn ghost" id="saltar">No sé — muéstrame</button>
    </div>`;
  const ta = document.getElementById('ta');
  ta.focus();
  document.getElementById('ver').onclick    = () => { respuesta = ta.value.trim(); revelar(); };
  document.getElementById('saltar').onclick = () => { respuesta = ''; revelar(); };
}

/* ---------- pantalla del diff (elemento firma) ---------- */
function revelar(){
  const l = cola[i];
  app.innerHTML = `
    <div class="card">
      <div class="eyebrow"><em>Compara</em><span>${i+1} / ${cola.length}</span></div>
      <div class="diff">
        ${respuesta ? `<div class="side mine">
            <div class="tag">Tu versión</div>
            <div class="body">${esc(respuesta)}</div>
          </div>` : ''}
        <div class="side native">
          <div class="tag">${l.tipo === 'producir' ? 'Cómo lo diría un nativo' : 'Lo que significa'}</div>
          <div class="body">${esc(l.modelo)}</div>
        </div>
      </div>
      <div class="why">
        <h4>El matiz</h4>
        <p>${l.matiz}</p>
      </div>
      <div class="chunk">
        <div class="t">${esc(l.chunk)}</div>
        <button id="say" aria-label="Escuchar">▶</button>
      </div>
      <div class="rate">
        <p>¿Cómo te fue?</p>
        <div class="row">
          <button data-n="1">Ni idea</button>
          <button data-n="2">Más o menos</button>
          <button data-n="3">Lo tenía</button>
        </div>
      </div>
    </div>`;
  document.getElementById('say').onclick = () => hablar(l.chunk);
  app.querySelectorAll('.rate button').forEach(b => {
    b.onclick = () => {
      calificar(l.id, +b.dataset.n);
      guardarChunk(l);
      i++;
      i < cola.length ? pregunta() : fin(false);
    };
  });
}

function guardarChunk(l){
  const c = Store.get('cuaderno', []);
  if(!c.some(x => x.id === l.id)){ c.unshift({id:l.id, t:l.chunk}); Store.set('cuaderno', c); }
}

/* ---------- fin de sesión ---------- */
function fin(vacia){
  const dias = vacia ? racha() : tocarRacha();
  const p = progreso();
  const vistas = Object.keys(p).length;
  bar.style.width = '100%';
  app.innerHTML = `
    <div class="done">
      <div class="big">${dias}</div>
      <h2>${vacia ? 'Nada pendiente hoy' : 'Listo por hoy'}</h2>
      <p>${vacia ? 'Vuelve mañana: las frases regresan justo antes de que las olvides.'
                 : 'Las que fallaste vuelven pronto. Las que sabías, más tarde.'}</p>
      <div class="stat">
        <div><b>${dias}</b><span>días seguidos</span></div>
        <div><b>${vistas}</b><span>de ${LECCIONES.length} vistas</span></div>
      </div>
      <button class="btn ghost" id="reset">Empezar de cero</button>
    </div>`;
  document.getElementById('reset').onclick = () => {
    if(confirm('Se borra tu racha y tu progreso. ¿Seguro?')){
      Store.set('prog', {}); Store.set('racha', {dias:0, ultimo:-1}); Store.set('cuaderno', []);
      iniciar(); pintarCuaderno();
    }
  };
  pintarCuaderno();
}

function pintarCuaderno(){
  const c = Store.get('cuaderno', []);
  const box = document.getElementById('book');
  const ul  = document.getElementById('bookList');
  if(!c.length){ box.hidden = true; return; }
  box.hidden = false;
  ul.innerHTML = c.map(x => `<li><b>›</b><span>${esc(x.t)}</span></li>`).join('');
  ul.querySelectorAll('li').forEach((li, k) => li.onclick = () => hablar(c[k].t));
}

/* ---------- arranque ---------- */
iniciar();
pintarCuaderno();

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
